name: test-coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    # Safety net for #6: mclapply() forking under gcov instrumentation can
    # deadlock (a documented covr/gcov limitation, see .can_fork() in
    # R/rng.R for the real fix), so fail fast instead of burning the
    # 6-hour default job timeout if a new fork/coverage interaction slips
    # through.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
        shell: Rscript {0}
